$kind: http-request
name: "5.1 Lay danh sach khach hang (Phan trang)"
description: Lay danh sach khach hang thanh vien
url: "{{baseUrl}}/customer?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
