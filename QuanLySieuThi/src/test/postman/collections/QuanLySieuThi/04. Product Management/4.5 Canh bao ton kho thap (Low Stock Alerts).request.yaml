$kind: http-request
name: "4.5 Canh bao ton kho thap (Low Stock Alerts)"
description: Danh sach san pham co so luong ton <= nguong threshold
url: "{{baseUrl}}/product/low-stock/alerts?threshold=10&page=1&limit=10"
method: GET
queryParams:
  limit: "10"
  threshold: "10"
  page: "1"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000

