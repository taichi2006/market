$kind: http-request
name: "1.4 Refresh Access Token"
description: Cap lai accessToken moi dua tren Cookie refreshToken
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var res = pm.response.json();
          if (res.data && res.data.accessToken) {
              pm.collectionVariables.set("accessToken", res.data.accessToken);
          }
      }
      pm.test("Status code is 200 or 400", function () { pm.expect([200, 400]).to.include(pm.response.code); });
    language: text/javascript
order: 4000

