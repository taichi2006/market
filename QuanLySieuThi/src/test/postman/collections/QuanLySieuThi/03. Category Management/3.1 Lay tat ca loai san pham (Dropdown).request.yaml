$kind: http-request
name: "3.1 Lay tat ca loai san pham (Dropdown)"
description: Lay toan bo danh sach loai san pham de do vao Select
url: "{{baseUrl}}/category?all=true"
method: GET
queryParams:
  all: "true"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      var res = pm.response.json();
      pm.test("Tra ve mang loai san pham", function () {
          pm.expect(res.data).to.be.an("array");
      });
    language: text/javascript
order: 1000

