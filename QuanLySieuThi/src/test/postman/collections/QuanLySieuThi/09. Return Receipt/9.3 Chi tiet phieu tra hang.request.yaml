$kind: http-request
name: "9.3 Chi tiet phieu tra hang"
description: Xem chi tiet phieu tra hang va so tien hoan
url: "{{baseUrl}}/return-receipt/{{returnReceiptId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 404", function () { pm.expect([200, 404]).to.include(pm.response.code); });
    language: text/javascript
order: 3000

