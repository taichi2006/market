$kind: http-request
description: Cap nhat ho ten, so dien thoai, trang thai nhan vien
url: "{{baseUrl}}/employee/{{employeeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Le Van Kho Test",
      "username": "inventory_test",
      "phoneNumber": "0912345677",
      "position": "INVENTORY_MANAGER",
      "status": true
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
