$kind: http-request
description: Lay chi tiet nhan vien theo ID
url: "{{baseUrl}}/employee/{{employeeId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
