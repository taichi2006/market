$kind: http-request
name: "2.1 Lay danh sach nhan vien (Phan trang)"
description: Lay danh sach nhan vien kem phan trang
url: "{{baseUrl}}/employee?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Tra ve mang nhan vien", function () {
          var res = pm.response.json();
          pm.expect(res.data).to.be.an("array");
      });
    language: text/javascript
order: 1000

