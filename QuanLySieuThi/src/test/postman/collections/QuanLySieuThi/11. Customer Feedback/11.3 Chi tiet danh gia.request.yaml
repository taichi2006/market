$kind: http-request
name: "11.3 Chi tiet danh gia"
description: Xem chi tiet 1 danh gia theo ID
url: "{{baseUrl}}/feedback/{{feedbackId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 404", function () { pm.expect([200, 404]).to.include(pm.response.code); });
    language: text/javascript
order: 3000

