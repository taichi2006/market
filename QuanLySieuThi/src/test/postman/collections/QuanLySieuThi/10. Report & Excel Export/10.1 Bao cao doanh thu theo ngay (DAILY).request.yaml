$kind: http-request
name: "10.1 Bao cao doanh thu theo ngay (DAILY)"
description: Bao cao doanh thu chi tiet theo moc thoi gian ngay
url: "{{baseUrl}}/report/revenue?type=DAILY&date=2026-10-14"
method: GET
queryParams:
  type: "DAILY"
  date: "2026-10-14"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000

